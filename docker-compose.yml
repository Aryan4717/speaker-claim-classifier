services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: speaker_claims
    ports:
      - "5432:5432"
    volumes:
      - speaker_claims_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d speaker_claims"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  speaker_claims_pg:
