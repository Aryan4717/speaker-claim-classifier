[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-claims"
version = "0.1.0"
description = "Classify factual claims in speaker-product answers against a supplied catalogue."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "openai==3.35.1",
    "langfuse==5.0.4",
    "sentry-sdk==2.72.0",
    "sqlalchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
